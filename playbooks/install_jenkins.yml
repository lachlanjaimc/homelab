- name: Install Jenkins on Controller Host
  hosts: jenkins-controller
  become: true

  tasks:
    - name: Download Jenkins repo signing key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc

    - name: Add Jenkins repo
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present

    - name: Update repos and install Jenkins with dependencies
      ansible.builtin.apt:
        name: 
          - fontconfig 
          - openjdk-21-jre
          - jenkins
        update_cache: yes

    - name: Start and enable systemd service for Jenkins
      ansible.builtin.systemd_service:
        name: jenkins
        enabled: true
        state: started

    - name: Read the initial admin password
      ansible.builtin.slurp:
        src: /var/lib/jenkins/secrets/initialAdminPassword
      register: initialAdminPassword

    - name: Decode and display password (not secure)
      ansible.builtin.debug:
        msg: "{{ initialAdminPassword['content'] | b64decode | trim }}"

    

